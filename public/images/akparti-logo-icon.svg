<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F37021" />
      <stop offset="100%" stop-color="#D65A0D" />
    </linearGradient>
    <linearGradient id="bulbGradIcon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D1"/>
      <stop offset="40%" stop-color="#FFC800"/>
      <stop offset="100%" stop-color="#F37021"/>
    </linearGradient>
    <linearGradient id="rayGradIcon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
  </defs>

  <!-- Circle Outer Badge -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGradIcon)" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- AK PARTİ LIGHT BULB EMBLEM -->
  <g transform="translate(50, 48) scale(0.42)">
    
    <!-- 7 Official Rays -->
    <polygon points="0,-105 -9,-55 9,-55" fill="url(#rayGradIcon)"/>
    <polygon points="60,-82 29,-41 42,-31" fill="url(#rayGradIcon)"/>
    <polygon points="96,-36 49,-18 54,-4" fill="url(#rayGradIcon)"/>
    <polygon points="100,22 53,13 49,27" fill="url(#rayGradIcon)"/>
    
    <polygon points="-60,-82 -42,-31 -29,-41" fill="url(#rayGradIcon)"/>
    <polygon points="-96,-36 -54,-4 -49,-18" fill="url(#rayGradIcon)"/>
    <polygon points="-100,22 -49,27 -53,13" fill="url(#rayGradIcon)"/>

    <!-- Main Bulb Body -->
    <path d="M 0,-48 
             C 25,-48 42,-29 42,-4 
             C 42,13 29,25 20,34 
             L 20,44 
             L -20,44 
             L -20,34 
             C -29,25 -42,13 -42,-4 
             C -42,-29 -25,-48 0,-48 Z" 
          fill="url(#bulbGradIcon)" 
          stroke="#FFFFFF" 
          stroke-width="3" />

    <!-- Bulb Filament -->
    <path d="M -12,8 Q 0,-22 12,8" fill="none" stroke="#0B2341" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M -7,10 L -7,34" fill="none" stroke="#0B2341" stroke-width="3"/>
    <path d="M 7,10 L 7,34" fill="none" stroke="#0B2341" stroke-width="3"/>

    <!-- Base -->
    <rect x="-18" y="44" width="36" height="6" rx="2" fill="#E2E8F0" stroke="#0B2341" stroke-width="2"/>
    <rect x="-15" y="50" width="30" height="5" rx="2" fill="#CBD5E1" stroke="#0B2341" stroke-width="2"/>
    <rect x="-12" y="55" width="24" height="5" rx="2" fill="#94A3B8" stroke="#0B2341" stroke-width="2"/>
    <path d="M -7,60 L 7,60 L 4,65 L -4,65 Z" fill="#0B2341"/>
  </g>
</svg>
