<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08182B" />
      <stop offset="50%" stop-color="#0B2341" />
      <stop offset="100%" stop-color="#163863" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#F37021" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#FFB800" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0B2341" stop-opacity="0"/>
    </radialGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="url(#bgGradient)" />
  <rect width="1200" height="500" fill="url(#centerGlow)" />

  <!-- Geometric Decorative Lines -->
  <path d="M-100,380 Q350,260 750,420 T1300,320 L1300,500 L-100,500 Z" fill="rgba(243, 112, 33, 0.15)" />
  <path d="M-100,420 Q450,330 850,450 T1300,380 L1300,500 L-100,500 Z" fill="rgba(255, 184, 0, 0.1)" />

  <!-- OFFICIAL DOWNLOADED AK PARTİ PNG LOGO EMBEDDED -->
  <g transform="translate(600, 150)" filter="url(#glowFilter)">
    <circle cx="0" cy="0" r="85" fill="#FFFFFF" opacity="0.12"/>
    <image href="/images/akparti-official-logo.png" x="-80" y="-80" width="160" height="160" />
  </g>

  <!-- AK PARTİ Brand Text -->
  <text x="600" y="295" text-anchor="middle" fill="#FFFFFF" font-family="'Segoe UI', 'Arial', sans-serif" font-weight="900" font-size="34" letter-spacing="6">AK PARTİ</text>
  <text x="600" y="330" text-anchor="middle" fill="#FFB800" font-family="'Segoe UI', 'Arial', sans-serif" font-weight="700" font-size="18" letter-spacing="8">ADAY TANITIM PLATFORMU</text>
  
  <line x1="450" y1="360" x2="750" y2="360" stroke="rgba(243, 112, 33, 0.6)" stroke-width="2" stroke-linecap="round"/>
  <text x="600" y="390" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-family="'Segoe UI', 'Arial', sans-serif" font-weight="600" font-size="15" letter-spacing="4">TÜRKİYE YÜZYILI İÇİN ESER VE HİZMET SİYASETİ</text>
</svg>
